name: simap-Diagnose

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - radar/diag.json
      - scripts/simap_diag.py

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/simap_diag.py
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/diag-result.json || true
          if ! git diff --cached --quiet; then git commit -m "simap-Diagnose: Ergebnis"; git pull --rebase origin main; git push; fi
