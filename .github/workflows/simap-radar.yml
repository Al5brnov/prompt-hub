name: simap-Radar

on:
  schedule:
    - cron: "20 5-18 * * 1-5"  # werktags stündlich 05:20–18:20 UTC (Winter 06:20–19:20, Sommer 07:20–20:20 Schweizer Zeit)
  workflow_dispatch: {}
  push:                      # sofort neu suchen, wenn Stichworte oder Skript geändert werden
    branches: [main]
    paths:
      - radar/config.json
      - scripts/simap_radar.py
      - .github/workflows/simap-radar.yml

permissions:
  contents: write

concurrency:
  group: simap-radar
  cancel-in-progress: false   # läuft ein Suchlauf noch, wartet der nächste

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zwischenspeicher laden
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: simap-details-${{ github.run_id }}
          restore-keys: simap-details-
      - name: simap abfragen
        run: python scripts/simap_radar.py
      - name: Zwischenspeicher sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: simap-details-${{ github.run_id }}
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/latest.json radar/history.csv radar/awards.json radar/awards.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "simap-Radar: Treffer aktualisiert"
            git pull --rebase origin main
            git push
          fi
