name: simap-Radar

on:
  schedule:
    - cron: "20 5-18 * * 1-5"  # werktags stündlich 05:20–18:20 UTC (Winter 06:20–19:20, Sommer 07:20–20:20 Schweizer Zeit)
  workflow_dispatch: {}
  push:                      # sofort neu suchen, wenn Stichworte oder Skript geändert werden
    branches: [main]
    paths:
      - radar/config.json
      - scripts/simap_radar.py
      - .github/workflows/simap-radar.yml

permissions:
  contents: write

concurrency:
  group: simap-radar
  cancel-in-progress: false   # läuft ein Suchlauf noch, wartet der nächste

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zwischenspeicher laden
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: simap-details-${{ github.run_id }}
          restore-keys: simap-details-
      - name: simap abfragen
        run: python scripts/simap_radar.py
      - name: Zwischenspeicher sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: simap-details-${{ github.run_id }}
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ergebnisdateien sichern, auf den neusten Stand von main setzen und nur die Ergebnisse darüberlegen.
          # So gibt es keine Merge-Konflikte, wenn inzwischen Code oder ein anderer Lauf gepusht wurde.
          mkdir -p /tmp/out
          for f in latest.json history.csv awards.json; do
            [ -f "radar/$f" ] && cp "radar/$f" /tmp/out/
          done
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/out/latest.json /tmp/out/history.csv radar/ 2>/dev/null || true
            # Zuschläge zusammenführen statt überschreiben (die Historie kann parallel ergänzt worden sein)
            [ -f /tmp/out/awards.json ] && python scripts/simap_award_history.py --merge /tmp/out/awards.json
            git add radar/latest.json radar/history.csv radar/awards.json radar/awards.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Keine Änderungen."
              exit 0
            fi
            git commit -q -m "simap-Radar: Treffer aktualisiert"
            if git push -q origin HEAD:main; then
              echo "Gespeichert."
              exit 0
            fi
            echo "Push abgelehnt, neuer Versuch ($i)"
            sleep 5
          done
          exit 1
